name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Tests run against the committed build — the files GitHub Pages serves.
      - name: Storefront
        run: node test-store.mjs
      - name: Product
        working-directory: product
        run: node test.mjs
      - name: Prices cover cost, fees and margin
        run: node pricing/reprice.mjs --check
      - name: Catalog content, SEO fields and cross-sells
        run: node pricing/check-catalog.mjs
      - name: WordPress store plugin parses
        run: php -l wordpress/peptide-store.php
      - name: Plugin zip matches the plugin source
        run: unzip -p dist/peptide-store.zip peptide-store/peptide-store.php | cmp - wordpress/peptide-store.php

  wordpress-plugin:
    # The store plugin on a real WordPress + WooCommerce + Rank Math site
    # (SQLite, pinned versions): schema, cart discounts, imports, reminder
    # emails, both checkouts in a browser, and no fatals without its dependencies.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, mbstring, intl, gd, zip
          tools: composer
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build the test site
        run: sh wordpress/test/setup.sh
      - name: Plugin checks
        run: sh wordpress/test/checks.sh
